<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diwali Buzzer Trivia</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen stage for the projector (scoreboard band, question stage, status strip, host console); phones get one giant team-colored buzzer */
:root{
  --night:#160c24; --panel:#23143a; --panel-2:#2e1b4a; --line:rgba(255,206,140,.18);
  --ink:#fbf0de; --muted:#c4b0cc; --gold:#f7b538; --gold-ink:#2a1300; --flame:#ff7a1a; --clay:#a93f0d; --flame-core:#fff6cc;
  --t1:#ff9f1c; --t1-ink:#2a1300; --t1-soft:rgba(255,159,28,.16);
  --t2:#1fc8b4; --t2-ink:#00231f; --t2-soft:rgba(31,200,180,.16);
  --good:#4ade80; --good-soft:rgba(74,222,128,.18); --bad:#ff5d6c;
  --display:"Yatra One", Georgia, "Times New Roman", serif;
  --body:"Hind", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
.join{display:flex; gap:20px; align-items:center; flex-wrap:wrap}
.join .code{font-family:var(--display); font-size:clamp(48px,6vw,84px); color:var(--gold); letter-spacing:.12em; line-height:1}
.join .url{font-weight:600; font-size:clamp(18px,1.8vw,24px); overflow-wrap:anywhere}
.qr{background:var(--ink); padding:10px; border-radius:12px; line-height:0}
.qr:empty{display:none}
.err{color:var(--bad); font-weight:600; min-height:1.2em; margin:0}
body{
  margin:0; background-color:var(--night); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  background-image:
    radial-gradient(ellipse 90% 55% at 50% 115%, rgba(255,122,26,.26), transparent 70%),
    radial-gradient(circle, rgba(247,181,56,.07) 1.4px, transparent 1.8px);
  background-size:100% 100%, 26px 26px; background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  overflow-x:hidden; -webkit-tap-highlight-color:transparent;
}
#app{height:100%; max-width:1440px; margin:0 auto; display:flex; flex-direction:column; padding-block:14px; box-sizing:border-box; gap:14px}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
input{font:inherit}
kbd{font-family:var(--body); font-weight:700; background:var(--panel-2); border:1px solid var(--line); border-bottom-width:3px; border-radius:6px; padding:0 .45em; font-size:.9em; color:var(--ink)}
h1,h2,h3{font-family:var(--display); font-weight:400; text-wrap:balance; margin:0; line-height:1.1}
.muted{color:var(--muted)}
.btn{padding:.65em 1.2em; border-radius:999px; background:var(--panel-2); border:1px solid var(--line); font-weight:600; transition:transform .1s, background .15s}
.btn:hover{background:var(--panel)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--gold); color:var(--gold-ink); border-color:transparent; font-size:1.1em; padding:.7em 1.6em}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.4; cursor:default}
.link{color:var(--muted); text-decoration:underline; text-underline-offset:3px; font-size:.9em}

/* diyas */
.diyas{display:flex; gap:22px; justify-content:center; padding-top:18px}
.diya{position:relative; width:38px; height:15px; background:linear-gradient(var(--flame),var(--clay)); border-radius:3px 3px 22px 22px}
.diya::before{content:""; position:absolute; left:50%; bottom:11px; width:11px; height:20px; transform:translateX(-50%); transform-origin:50% 100%;
  background:radial-gradient(circle at 50% 72%, var(--flame-core) 0 22%, var(--gold) 46%, var(--flame) 70%, transparent 72%);
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%; filter:drop-shadow(0 0 8px var(--flame)); animation:flicker 1.6s infinite ease-in-out}
.diya:nth-child(2)::before{animation-delay:-.5s}.diya:nth-child(3)::before{animation-delay:-1.1s}.diya:nth-child(4)::before{animation-delay:-.8s}.diya:nth-child(5)::before{animation-delay:-.2s}
@keyframes flicker{0%,100%{transform:translateX(-50%) scale(1,1)}35%{transform:translateX(-52%) scale(.92,1.08) rotate(-3deg)}70%{transform:translateX(-48%) scale(1.05,.95) rotate(2deg)}}

/* mode picker */
.picker{margin:auto; max-width:640px; width:100%; text-align:center; display:flex; flex-direction:column; gap:22px}
.picker h1{font-size:clamp(38px,7vw,72px); color:var(--gold)}
.pick-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.pick{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px 18px; text-align:left; display:flex; flex-direction:column; gap:6px}
.pick strong{font-family:var(--display); font-weight:400; font-size:24px; color:var(--ink)}
.pick span{color:var(--muted)}
.pick:hover{border-color:var(--gold)}
@media (max-width:560px){.pick-grid{grid-template-columns:1fr}}

/* lobby */
.lobby{display:flex; flex-direction:column; gap:20px; overflow:auto; min-height:0}
.brand{text-align:center; display:flex; flex-direction:column; gap:8px}
.brand h1{font-size:clamp(40px,6vw,84px); color:var(--gold); text-shadow:0 0 30px rgba(255,122,26,.35)}
.brand .sub{color:var(--muted); font-size:clamp(16px,1.5vw,20px); margin:0}
.teams{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.team-card{border-radius:20px; padding:18px 20px; display:flex; flex-direction:column; gap:10px; border:1px solid var(--line); min-width:0}
.team-card.t1{background:var(--t1-soft); border-color:var(--t1)}
.team-card.t2{background:var(--t2-soft); border-color:var(--t2)}
.team-card label{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.team-card input{background:var(--night); border:1px solid var(--line); border-radius:12px; color:var(--ink); padding:.45em .7em; font-family:var(--display); font-size:clamp(22px,2.4vw,32px); width:100%; box-sizing:border-box}
.joined{display:flex; flex-wrap:wrap; gap:6px; min-height:30px; align-items:center}
.pill{border-radius:999px; padding:2px 12px; font-weight:600; font-size:15px}
.t1 .pill,.pill.t1{background:var(--t1); color:var(--t1-ink)}
.t2 .pill,.pill.t2{background:var(--t2); color:var(--t2-ink)}
.keyline{font-size:15px; color:var(--muted)}
.info{display:grid; grid-template-columns:1.1fr 1fr; gap:16px}
.box{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px 20px; min-width:0}
.box h3{font-size:22px; color:var(--gold); margin-bottom:10px}
.box ol,.box ul{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px}
.rounds{list-style:none; padding:0!important}
.rounds li{display:flex; justify-content:space-between; gap:12px; border-bottom:1px dashed var(--line); padding-bottom:6px}
.rounds b{font-weight:600}
.rounds span{color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
@media (max-width:760px){.teams,.info{grid-template-columns:1fr}}

/* console */
.console{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end}
.console .grow{flex:1; min-width:180px; color:var(--muted); font-size:15px}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--muted); margin-right:6px; vertical-align:1px}
.dot.on{background:var(--good); box-shadow:0 0 8px var(--good)}
.dot.off{background:var(--bad)}

/* game board */
.board{flex:1; min-height:0; display:grid; grid-template-rows:auto 1fr auto auto; gap:14px}
.scorebar{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch}
.score{border-radius:18px; padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border:2px solid transparent; min-width:0; transition:box-shadow .2s, transform .2s}
.score.t1{background:var(--t1-soft); border-color:var(--t1)}
.score.t2{background:var(--t2-soft); border-color:var(--t2); flex-direction:row-reverse}
.score.lit.t1{box-shadow:0 0 0 4px var(--t1), 0 0 40px var(--t1); transform:scale(1.02)}
.score.lit.t2{box-shadow:0 0 0 4px var(--t2), 0 0 40px var(--t2); transform:scale(1.02)}
.score .nm{font-family:var(--display); font-size:clamp(18px,2.2vw,34px); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.score .pts{font-size:clamp(30px,4vw,64px); font-weight:700; font-variant-numeric:tabular-nums; line-height:1}
.score.t1 .pts{color:var(--t1)} .score.t2 .pts{color:var(--t2)}
.adj{display:flex; flex-direction:column; gap:2px}
.adj button{font-size:12px; color:var(--muted); padding:0 6px; border-radius:6px; line-height:1.4}
.adj button:hover{background:var(--panel-2); color:var(--ink)}
.score .left{display:flex; flex-direction:column; min-width:0}
.score .key{font-size:13px; color:var(--muted)}
.center{text-align:center; display:flex; flex-direction:column; justify-content:center; padding:0 8px}
.center .rn{font-family:var(--display); color:var(--gold); font-size:clamp(16px,1.7vw,24px)}
.center .qn{color:var(--muted); font-variant-numeric:tabular-nums; font-size:15px; white-space:nowrap}
.stage{min-height:0; display:flex; flex-direction:column; justify-content:center; gap:clamp(14px,2.5vh,30px); overflow:auto}
.qtext{font-family:var(--display); font-size:clamp(26px,4vw,62px); line-height:1.15; text-align:center; margin:0 auto; max-width:24ch; text-wrap:balance}
.mltag{align-self:center; border:1px dashed var(--t2); color:var(--t2); border-radius:999px; padding:3px 16px; font-weight:700; font-size:clamp(13px,1.3vw,18px); letter-spacing:.1em; text-transform:uppercase}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.opt{display:flex; align-items:center; gap:14px; text-align:left; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:clamp(10px,1.6vh,20px) 18px; font-size:clamp(18px,2.3vw,36px); font-weight:600; min-width:0; transition:background .2s, border-color .2s, opacity .2s}
.opt:hover{border-color:var(--gold)}
.opt .n{flex:none; width:1.6em; height:1.6em; border-radius:50%; display:grid; place-items:center; background:var(--gold); color:var(--gold-ink); font-size:.7em; font-weight:700}
.opt .tx{min-width:0}
.opt.correct{background:var(--good-soft); border-color:var(--good)}
.opt.correct .n{background:var(--good)}
.opt.wrong{border-color:var(--bad); opacity:.5}
.opt.wrong .tx{text-decoration:line-through; text-decoration-color:var(--bad)}
.opt.dim{opacity:.35}
@media (max-width:700px){.opts{grid-template-columns:1fr}.scorebar{grid-template-columns:1fr 1fr}.center{grid-column:1/-1; order:-1}}

.status{border-radius:18px; padding:14px 22px; text-align:center; background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; gap:4px; align-items:center}
.status .big{font-family:var(--display); font-size:clamp(22px,3vw,46px); line-height:1.15}
.status .small{font-size:clamp(15px,1.4vw,20px)}
.status.open{background:var(--gold); color:var(--gold-ink); border-color:transparent; animation:pulse 1s infinite}
.status.t1{background:var(--t1); color:var(--t1-ink); border-color:transparent}
.status.t2{background:var(--t2); color:var(--t2-ink); border-color:transparent}
.status.good{background:var(--good-soft); border-color:var(--good)}
.status .fact{color:var(--muted); font-size:clamp(15px,1.4vw,20px)}
.status.t1 .fact,.status.t2 .fact{color:inherit; opacity:.8}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(247,181,56,.25)}}
.bar{width:min(420px,80%); height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--gold); animation:fill 3s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.timer{font-variant-numeric:tabular-nums; font-weight:700}
.buzzflash{animation:flash .5s ease-out}
@keyframes flash{0%{transform:scale(1.06)}100%{transform:scale(1)}}

.roundcard{text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center}
.roundcard .eyebrow{letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-size:clamp(14px,1.4vw,18px)}
.roundcard h2{font-size:clamp(44px,7vw,110px); color:var(--gold)}
.roundcard p{font-size:clamp(18px,2vw,28px); margin:0}
.double{display:inline-block; background:var(--flame); color:var(--gold-ink); border-radius:999px; padding:2px 16px; font-weight:700}

/* end */
.end{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center}
.end canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.end h1{font-size:clamp(46px,8vw,120px); color:var(--gold); position:relative}
.end h2{font-size:clamp(26px,4vw,56px); position:relative}
.final{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; position:relative}
.final .score{min-width:220px}

/* phone */
.phone{flex:1; display:flex; flex-direction:column; gap:14px; max-width:520px; width:100%; margin:0 auto; min-height:0}
.ph-top{display:flex; align-items:center; gap:10px}
.ph-top .who{flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ph-score{display:flex; justify-content:space-between; gap:8px; font-variant-numeric:tabular-nums; font-weight:600; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 14px}
.ph-score .s1{color:var(--t1)} .ph-score .s2{color:var(--t2)}
.ph-main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; min-height:0}
.ph-msg{font-family:var(--display); font-size:clamp(24px,7vw,34px); line-height:1.2; text-wrap:balance}
.ph-sub{color:var(--muted); font-size:17px; max-width:34ch}
.buzzer{width:min(78vw,340px); aspect-ratio:1; max-width:100%; border-radius:50%; font-family:var(--display); font-size:clamp(40px,13vw,64px); touch-action:manipulation; user-select:none; -webkit-user-select:none; transition:transform .08s, filter .2s}
.buzzer.t1{background:radial-gradient(circle at 40% 32%, var(--flame-core), var(--t1) 40%, var(--clay)); color:var(--t1-ink); box-shadow:0 10px 0 var(--clay), 0 0 60px var(--t1)}
.buzzer.t2{background:radial-gradient(circle at 40% 32%, var(--flame-core), var(--t2) 40%, #0b6157); color:var(--t2-ink); box-shadow:0 10px 0 #0b6157, 0 0 60px var(--t2)}
.buzzer:active{transform:translateY(8px) scale(.98)}
.buzzer[disabled]{filter:grayscale(.85) brightness(.55); box-shadow:none; cursor:default}
.ph-q{font-size:18px; font-weight:600; max-width:36ch}
.ph-opts{display:flex; flex-direction:column; gap:10px; width:100%}
.ph-opts .opt{font-size:20px; padding:14px 16px}
.setup{display:flex; flex-direction:column; gap:14px; width:100%}
.setup label{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:left}
.setup input{background:var(--panel); border:1px solid var(--line); border-radius:14px; color:var(--ink); padding:.7em .9em; font-size:18px; width:100%; box-sizing:border-box}
.teampick{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.teampick button{border-radius:18px; padding:22px 10px; font-family:var(--display); font-size:22px; overflow-wrap:anywhere}
.teampick .t1{background:var(--t1); color:var(--t1-ink)}
.teampick .t2{background:var(--t2); color:var(--t2-ink)}
.notice{background:var(--panel); border:1px solid var(--bad); border-radius:16px; padding:16px; text-align:left}

@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(function(){
"use strict";

/* ---------------- Questions ---------------- */
const ROUNDS = [
  { name:"Bollywood Basics", pts:100, blurb:"Filmi classics everyone should know", qs:[
    ["Which actor is known as the “King of Bollywood”?","Shah Rukh Khan",["Salman Khan","Aamir Khan","Hrithik Roshan"],"Fans also call him SRK or King Khan."],
    ["In Dilwale Dulhania Le Jayenge (1995), what are the lead couple’s names?","Raj and Simran",["Rahul and Anjali","Prem and Nisha","Veeru and Basanti"],"DDLJ played at Mumbai’s Maratha Mandir theatre for more than 1,000 weeks."],
    ["Gabbar Singh is the iconic villain of which film?","Sholay",["Mr. India","Karan Arjun","Agneepath"],"Sholay (1975) starred Amitabh Bachchan and Dharmendra as Jai and Veeru."],
    ["Which actor is nicknamed “Mr. Perfectionist”?","Aamir Khan",["Akshay Kumar","Ranbir Kapoor","Ajay Devgn"],"He starred in Lagaan, 3 Idiots and Dangal."],
    ["“All is well” is the life motto in which movie?","3 Idiots",["PK","Dangal","Chak De! India"],"3 Idiots (2009) is set at an engineering college."],
    ["The Oscar-winning song “Naatu Naatu” is from which film?","RRR",["Baahubali","Pushpa","KGF"],"It won Best Original Song at the 2023 Oscars."],
    ["In which film does Shah Rukh Khan dance to “Chaiyya Chaiyya” on top of a moving train?","Dil Se",["Kal Ho Naa Ho","Devdas","Kuch Kuch Hota Hai"],"A. R. Rahman composed the song."],
    ["Google’s famous 2018 language model shares its name with which Sesame Street character?","Bert",["Elmo","Grover","Chhota Bheem"],"ELMo and Grover were real models too, both from AllenAI. NLP researchers really love Sesame Street.",true],
    ["Who played “Poo” in Kabhi Khushi Kabhie Gham?","Kareena Kapoor",["Kajol","Rani Mukerji","Preity Zinta"],"Kajol played her older sister, Anjali."],
    ["Priyanka Chopra won Miss World in which year?","2000",["1994","1997","2004"],"Aishwarya Rai won Miss World back in 1994."]
  ]},
  { name:"Diwali & Traditions", pts:100, blurb:"Lamps, legends and the five days of the festival", qs:[
    ["“Deepavali” comes from Sanskrit. What does it mean?","A row of lights",["Festival of sweets","Night of the new moon","Victory of good"],"Deepa means lamp and avali means row."],
    ["Diwali celebrates Lord Rama returning home to which city?","Ayodhya",["Lanka","Mathura","Varanasi"],"People lit lamps to welcome him back after he defeated Ravana."],
    ["How many years was Rama in exile?","14 years",["7 years","10 years","12 years"],"Sita and Lakshmana went into exile with him."],
    ["Which goddess of wealth and prosperity is worshipped on Diwali night?","Lakshmi",["Saraswati","Durga","Parvati"],"Lakshmi Puja is usually done in the evening, with the lamps lit."],
    ["Lakshmi brings wealth. Which company’s GPUs bring wealth to AI labs?","NVIDIA",["Intel","AMD","Bajaj"],"CEO Jensen Huang is almost never seen without his leather jacket.",true],
    ["What are the small clay oil lamps lit on Diwali called?","Diyas",["Kandils","Agarbattis","Torans"],"A kandil is the hanging paper lantern; a toran is the doorway garland."],
    ["What are the colorful patterns made on the floor with powder or flower petals?","Rangoli",["Mehndi","Bandhani","Madhubani"],"In Tamil Nadu, a similar rice-flour design is called kolam."],
    ["Diwali falls on which phase of the moon?","New moon",["Full moon","Half moon","Crescent moon"],"It’s the darkest night of the month, which is why the lamps matter."],
    ["On which day of Diwali do people traditionally buy gold, silver or new utensils?","Dhanteras",["Bhai Dooj","Govardhan Puja","Choti Diwali"],"Dhanteras is the first of the five days."],
    ["What do you call it when a chatbot confidently makes something up?","A hallucination",["Overfitting","Mode collapse","Jugaad"],"Always check the citations.",true],
    ["The last day of the five-day festival celebrates brothers and sisters. What is it called?","Bhai Dooj",["Raksha Bandhan","Karva Chauth","Chhath"],"Sisters put a tilak on their brothers’ foreheads and pray for them."],
    ["Sikhs celebrate Bandi Chhor Divas at Diwali, marking which Guru’s release from prison?","Guru Hargobind",["Guru Nanak","Guru Gobind Singh","Guru Arjan"],"The Golden Temple in Amritsar is lit up for the occasion."]
  ]},
  { name:"Desi Mix", pts:200, blurb:"Food, cricket and India GK. Double points!", qs:[
    ["Which sweet is a fried milk-dough ball soaked in sugar syrup?","Gulab jamun",["Rasgulla","Barfi","Kaju katli"],"Rasgulla is soaked in syrup too, but it’s boiled, not fried."],
    ["Which cricketer is called the “God of Cricket”?","Sachin Tendulkar",["Virat Kohli","MS Dhoni","Kapil Dev"],"He scored 100 international centuries."],
    ["India won its first Cricket World Cup in which year?","1983",["1975","1996","2011"],"Kapil Dev captained the team to victory at Lord’s."],
    ["In 2016, which AI beat world champion Lee Sedol at the board game Go?","AlphaGo",["Deep Blue","Watson","Viswanathan Anand"],"Its “Move 37” looked like a blunder and turned out to be brilliant.",true],
    ["What is India’s national animal?","Bengal tiger",["Asiatic lion","Indian elephant","Peacock"],"The peacock is the national bird."],

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = s => String(s ?? "").replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯]/g,"").trim().slice(0,20);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const DIYAS = '<div class="diyas" aria-hidden="true"><i class="diya"></i><i class="diya"></i><i class="diya"></i><i class="diya"></i><i class="diya"></i></div>';

/* ---------------- Sound ---------------- */
let AC = null;
function ac(){
  if(!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
  if(AC && AC.state === "suspended") AC.resume().catch(()=>{});
  return AC;
}
function tone(f, dur, type, when, vol, slideTo){
  const a = ac(); if(!a) return;
  const t = a.currentTime + (when||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function sfx(kind, team){
  if(kind==="buzz"){ const f = team===0 ? 440 : 330; tone(f,.5,"square",0,.16); tone(f*1.5,.5,"sawtooth",0,.07); }
  else if(kind==="open"){ tone(660,.12,"triangle",0,.18); tone(990,.2,"triangle",.12,.18); }
  else if(kind==="right"){ [523,659,784,1047].forEach((f,i)=>tone(f,.28,"triangle",i*.09,.2)); }
  else if(kind==="wrong"){ tone(196,.55,"sawtooth",0,.14,98); }
  else if(kind==="win"){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.32,"triangle",i*.13,.2)); }
}

/* ---------------- Mode ---------------- */
let mode = null; // "host" | "buzzer"
const params = new URLSearchParams(location.search);
const urlCode = (params.get("room")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
const h = (location.hash||"").replace("#","");

else if(h==="host"||h==="buzzer") mode = h;
else mode = store.get("dbt-mode");

/* ---------------- Room (MQTT relay, room codes) ---------------- */
let room = null, roomCode = null, roomState = "connecting", myPeer = null, hostSince = Date.now();
const TOPIC_PREFIX = "seyonec-diwali/v1/";
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
function newCode(){ const A = "ABCDEFGHJKMNPQRSTUVWXYZ"; let s = ""; for(let i=0;i<4;i++) s += A[Math.floor(Math.random()*A.length)]; return s; }
let hostCode = store.get("dbt-code");
if(!/^[A-Z]{4}$/.test(hostCode||"")){ hostCode = newCode(); store.set("dbt-code", hostCode); }
const joinUrl = () => location.origin + location.pathname + "?room=" + hostCode;
const joinUrlShort = () => (location.host + location.pathname).replace(/\/$/,"");

function mergeInto(obj, patch){ for(const k in patch){ if(patch[k]===null) delete obj[k]; else obj[k] = patch[k]; } }
function randId(n){ const A = "abcdefghijkmnopqrstuvwxyz23456789"; let s = ""; for(let i=0;i<n;i++) s += A[Math.floor(Math.random()*A.length)]; return s; }
function parseMsg(payload){
  try { const s = payload == null ? "" : payload.toString(); if(!s) return { empty:true }; const d = JSON.parse(s); return (d && typeof d==="object" && !Array.isArray(d)) ? { data:d } : null; }
  catch(e){ return null; }
}

/* Connects to the first broker that answers, same order on every device.
   Moves on only if a client never connects within ~8s; once connected it stays and auto-reconnects. */
function mqttLink(opts){
  let client = null, idx = 0, dead = false, everConnected = false, failT = null;
  function attempt(){
    if(dead) return;
    const url = BROKERS[idx % BROKERS.length];
    const o = { clientId: "dbt_" + randId(12), clean:true, connectTimeout:8000, reconnectPeriod:2000, keepalive:30 };
    if(opts.will) o.will = opts.will;
    let c;
    try { c = mqtt.connect(url, o); } catch(e){ idx++; clearTimeout(failT); failT = setTimeout(attempt, 1000); return; }
    client = c;
    clearTimeout(failT);
    failT = setTimeout(() => {
      if(dead || everConnected || client!==c) return;
      try { c.end(true); } catch(e){}
      idx++; attempt();
    }, 8500);
    c.on("connect", () => { if(client!==c || dead) return; everConnected = true; clearTimeout(failT); opts.onConnect(c); });
    c.on("message", (topic, payload) => { if(client!==c || dead) return; opts.onMessage(topic, payload); });
    const down = () => { if(client!==c || dead) return; opts.onDown(); };
    c.on("close", down); c.on("offline", down);
    c.on("error", () => {});
  }
  attempt();
  return {
    publish(topic, msg, o){ try { if(client && client.connected) client.publish(topic, msg, o || { qos:0, retain:false }); } catch(e){} },
    connected(){ return !!(client && client.connected); },
    end(beforeEnd){ dead = true; clearTimeout(failT); const c = client; if(!c) return; try { if(beforeEnd && c.connected) beforeEnd(c); } catch(e){} try { c.end(false); } catch(e){} }
  };
}

function startRoom(code){
  if(room){ room.destroy(); room = null; }
  roomCode = code || null;
  if(!code){ roomState = "connecting"; return; }
  if(typeof window.mqtt?.connect !== "function"){ roomState = "off"; refreshRoomUI(); return; }
  room = mode==="host" ? hostRoom(code) : phoneRoom(code);
  room.onPeers(onPeers);
}

function hostRoom(code){
  const base = TOPIC_PREFIX + code + "/";
  let handler = null, sweep = null;
  const mine = {}, phones = new Map();
  const snap = id => { const c = phones.get(id); return { peer:id, isMe:false, sameTab:false, presence: c ? c.presence : {} }; };
  const all = () => [{ peer:"host", isMe:true, sameTab:true, presence:mine }].concat([...phones.keys()].map(snap));
  const fire = (j,u,l) => { if(handler) handler({ peers:all(), joined:j||[], updated:u||[], left:l||[] }); };
  const drop = id => { if(!phones.has(id)) return; const s = snap(id); phones.delete(id); fire([], [], [s]); };
  const sendMine = () => { if(Object.keys(mine).length) link.publish(base+"host", JSON.stringify(mine), { qos:0, retain:true }); };
  roomState = "connecting"; refreshRoomUI();
  const link = mqttLink({
    will: { topic: base+"host", payload: "", qos:0, retain:true },
    onConnect(c){
      c.subscribe([base+"p/+", base+"bye/+"], { qos:0 });
      roomState = "on"; refreshRoomUI();
      sendMine();
      link.publish(base+"ping", "1", { qos:0, retain:false });
    },
    onDown(){ if(roomState!=="connecting"){ roomState = "connecting"; refreshRoomUI(); } },
    onMessage(topic, payload){
      if(topic.indexOf(base)!==0) return;
      const rest = topic.slice(base.length), slash = rest.indexOf("/");
      if(slash<0) return;
      const kind = rest.slice(0, slash), id = rest.slice(slash+1);
      if(!id || id.indexOf("/")>=0) return;
      if(kind==="bye"){ drop(id); return; }
      if(kind!=="p") return;
      const m = parseMsg(payload); if(!m) return;
      if(m.empty){ drop(id); return; }
      const ex = phones.get(id);
      // Phones always send their full presence object, so it replaces the old one.
      const n = {}; mergeInto(n, m.data);
      if(ex){ ex.presence = n; ex.lastSeen = Date.now(); fire([], [snap(id)]); }
      else { phones.set(id, { presence:n, lastSeen:Date.now() }); fire([snap(id)]); }
    }
  });
  sweep = setInterval(() => {
    const now = Date.now();
    for(const [id, c] of [...phones.entries()]) if(now - c.lastSeen > 40000) drop(id);
  }, 5000);
  return {
    presence(patch){ mergeInto(mine, patch); sendMine(); return Promise.resolve(); },
    onPeers(fn){ handler = fn; return () => { handler = null; }; },
    peers: all,
    destroy(){ clearInterval(sweep); handler = null; link.end(c => c.publish(base+"host", "", { qos:0, retain:true })); }
  };
}

function phoneRoom(code){
  const base = TOPIC_PREFIX + code + "/";
  const id = randId(10);
  myPeer = id;
  let handler = null, hostP = null, gotHost = false, noHostT = null, beat = null, dead = false;
  const mine = {};
  const all = () => { const a = [{ peer:id, isMe:true, sameTab:true, presence:mine }]; if(hostP) a.push({ peer:"host", isMe:false, sameTab:false, presence:hostP }); return a; };
  const fire = () => { if(handler) handler({ peers:all(), joined:[], updated:[], left:[] }); };
  const sendMine = () => link.publish(base+"p/"+id, JSON.stringify(mine), { qos:0, retain:false });
  roomState = "connecting";
  const link = mqttLink({
    will: { topic: base+"bye/"+id, payload: "1", qos:0, retain:false },
    onConnect(c){
      c.subscribe([base+"host", base+"ping"], { qos:0 });
      sendMine();
      if(gotHost){ roomState = "on"; refreshRoomUI(); }
      else {
        clearTimeout(noHostT);
        noHostT = setTimeout(() => { if(!dead && !gotHost && link.connected()){ roomState = "nohost"; refreshRoomUI(); } }, 6000);
      }
    },
    onDown(){ clearTimeout(noHostT); if(roomState!=="connecting"){ roomState = "connecting"; refreshRoomUI(); } },
    onMessage(topic, payload){
      if(topic===base+"ping"){ sendMine(); return; }
      if(topic!==base+"host") return;
      const m = parseMsg(payload); if(!m) return;
      if(m.empty){ hostP = null; fire(); return; }
      hostP = m.data; gotHost = true; clearTimeout(noHostT);
      if(roomState!=="on"){ roomState = "on"; refreshRoomUI(); }
      fire();
    }
  });
  beat = setInterval(sendMine, 15000);
  return {
    presence(patch){ mergeInto(mine, patch); sendMine(); return Promise.resolve(); },
    onPeers(fn){ handler = fn; return () => { handler = null; }; },
    peers: all,
    destroy(){ dead = true; clearInterval(beat); clearTimeout(noHostT); handler = null; link.end(c => c.publish(base+"bye/"+id, "1", { qos:0, retain:false })); }
  };
}

function onPeers(ch){
  const me = ch.peers.find(p => p.isMe && p.sameTab);
  if(me) myPeer = me.peer;
  if(mode==="host") hostOnPeers(ch);
  else if(mode==="buzzer") phoneOnPeers(ch);
}
function refreshRoomUI(){
  if(mode==="host") renderRoomStatus();
  else if(mode==="buzzer") renderPhone(true);
}

/* ================= HOST ================= */
function fresh(teams){
  return { phase:"lobby", teams: teams || ["Team Saffron","Team Peacock"], scores:[0,0], order:null, qi:-1,
    buzzId:0, buzzTeam:null, buzzPeer:null, buzzName:"", stealTeam:null, wrong:[], chosen:null, result:null,
    epoch:Date.now(), phaseAt:Date.now() };
}
let S = store.get("dbt-host");
if(!S || !S.phase || !Array.isArray(S.teams)) S = fresh();
let readT = null;

function buildOrder(){
  const out = [];
  ROUNDS.forEach((r, ri) => r.qs.forEach((q, qi) => {
    const opts = shuffle([q[1], ...q[2]]);
    out.push({ ri, round:r.name, blurb:r.blurb, pts:r.pts, text:q[0], opts, correct:opts.indexOf(q[1]), fact:q[3], ml: !!q[4], first: qi===0, idxInRound: qi+1, roundLen:r.qs.length });
  }));
  return out;
}
const cur = () => (S.order && S.qi>=0) ? S.order[S.qi] : null;
const key = suffix => S.epoch + ":" + S.buzzId + (suffix||"");

function setPhase(p){ S.phase = p; S.phaseAt = Date.now(); store.set("dbt-host", S); pushPresence(); renderHost(); }

function startGame(){
  ac();
  const teams = S.teams.map((t,i) => clean(t) || (i ? "Team Peacock" : "Team Saffron"));
  S = fresh(teams); S.order = buildOrder(); S.qi = 0;
  enterQuestion();
}
function enterQuestion(){ const q = cur(); if(q && q.first) setPhase("roundcard"); else beginReading(); }
function resetBuzz(){ S.buzzId++; S.buzzTeam=null; S.buzzPeer=null; S.buzzName=""; S.stealTeam=null; }
function beginReading(){
  resetBuzz(); S.wrong=[]; S.result=null; S.chosen=null;
  setPhase("reading");
  const id = S.buzzId; clearTimeout(readT);
  readT = setTimeout(() => { if(S.phase==="reading" && S.buzzId===id) openBuzzers(); }, 3000);
}
function openBuzzers(){ clearTimeout(readT); sfx("open"); setPhase("open"); }
function reopen(){ resetBuzz(); S.wrong=[]; sfx("open"); setPhase("open"); }
function acceptBuzz(team, peer, name){
  if(S.phase!=="open" || (team!==0 && team!==1)) return;
  S.buzzTeam = team; S.buzzPeer = peer || null; S.buzzName = name || "";
  sfx("buzz", team); setPhase("answer");
}
function choose(i){
  const q = cur(); if(!q || i<0 || i>3) return;
  if(S.phase==="answer"){
    if(i===q.correct){ S.scores[S.buzzTeam]+=q.pts; S.result="correct"; S.chosen=i; sfx("right"); setPhase("reveal"); }
    else { S.wrong=[i]; S.stealTeam = 1-S.buzzTeam; sfx("wrong"); setPhase("steal"); }
  } else if(S.phase==="steal"){
    if(S.wrong.includes(i)) return;
    S.chosen = i;
    if(i===q.correct){ S.scores[S.stealTeam]+=q.pts; S.result="stolen"; sfx("right"); }
    else { S.wrong.push(i); S.result="missed"; sfx("wrong"); }
    setPhase("reveal");
  }
}
function markWrong(){
  if(S.phase==="answer"){ S.stealTeam = 1-S.buzzTeam; sfx("wrong"); setPhase("steal"); }
  else if(S.phase==="steal"){ S.result="missed"; sfx("wrong"); setPhase("reveal"); }
}
function revealNow(){ clearTimeout(readT); S.result = S.phase==="steal" ? "missed" : "nobody"; setPhase("reveal"); }
function nextQ(){
  if(S.qi+1 >= S.order.length){ sfx("win"); setPhase("end"); return; }
  S.qi++; enterQuestion();
}
function newGame(){ S = fresh(S.teams); store.set("dbt-host", S); pushPresence(); renderHost(); }
function primary(){
  ({ lobby:startGame, roundcard:beginReading, reading:openBuzzers, open:revealNow, steal:revealNow, reveal:nextQ, end:newGame }[S.phase] || (()=>{}))();
}

function pushPresence(){
  if(!room || mode!=="host") return;
  const q = cur();
  const showQ = ["reading","open","answer","steal","reveal"].includes(S.phase) && q;
  room.presence({
    role:"host", since:hostSince, epoch:S.epoch, phase:S.phase, buzzId:S.buzzId,
    teams:S.teams, scores:S.scores, qn:S.qi+1, total:S.order ? S.order.length : 30,
    round: q ? q.round : null, pts: q ? q.pts : null,
    q: showQ ? q.text : null, opts: showQ ? q.opts : null,
    buzzTeam:S.buzzTeam, buzzPeer:S.buzzPeer, buzzName:S.buzzName || null, stealTeam:S.stealTeam,
    wrong:S.wrong, correct: (S.phase==="reveal" && q) ? q.correct : null, result:S.result,
    winner: S.phase==="end" ? (S.scores[0]===S.scores[1] ? -1 : (S.scores[0]>S.scores[1] ? 0 : 1)) : null
  }).catch(()=>{});
}

function hostOnPeers(ch){
  const list = ch.joined.concat(ch.updated);
  for(const p of list){
    if(p.isMe && p.sameTab) continue;
    const pr = p.presence || {};
    if(pr.role!=="buzzer") continue;
    const team = pr.team;
    if(S.phase==="open" && pr.buzz===key()) acceptBuzz(team, p.peer, clean(pr.nick));
    const a = pr.ans;
    if(a && typeof a.c==="number"){
      if(S.phase==="answer" && p.peer===S.buzzPeer && a.k===key("a")) choose(a.c);
      else if(S.phase==="steal" && team===S.stealTeam && a.k===key("s")) choose(a.c);
    }
  }
  renderJoined(ch.peers);
}
function buzzersByTeam(peers){
  const t = [[],[]];
  (peers || (room ? room.peers() : [])).forEach(p => {
    const pr = p.presence || {};
    if(pr.role==="buzzer" && (pr.team===0||pr.team===1)) t[pr.team].push(clean(pr.nick) || "Player");
  });
  return t;
}
function renderJoined(peers){
  const t = buzzersByTeam(peers);
  [0,1].forEach(i => {
    const el = document.getElementById("joined"+i);
    if(el) el.innerHTML = t[i].length ? t[i].map(n => '<span class="pill">'+esc(n)+'</span>').join("") : '<span class="muted">No phone buzzers yet</span>';
  });
  const strip = document.getElementById("buzzStrip");
  if(strip) strip.innerHTML = roomLabel() + (roomState==="on" ? ' &middot; '+esc(S.teams[0])+': '+t[0].length+' phone'+(t[0].length===1?"":"s")+' &middot; '+esc(S.teams[1])+': '+t[1].length : "");
}
function roomLabel(){
  if(roomState==="on") return '<span class="dot on"></span>Room <b>'+hostCode+'</b> open at '+esc(joinUrlShort());
  if(roomState==="off") return '<span class="dot off"></span>Phone buzzers couldn’t load. Check the internet and reload, or use keys <kbd>A</kbd> / <kbd>L</kbd>';
  return '<span class="dot"></span>Opening room '+hostCode+'…';
}
function renderRoomStatus(){
  const el = document.getElementById("roomStatus"); if(el) el.innerHTML = roomLabel();
  renderJoined();
}

function scoreBox(i, lit){
  return '<div class="score t'+(i+1)+(lit?' lit':'')+'"><div class="left"><span class="nm">'+esc(S.teams[i])+'</span><span class="key">Key: '+(i===0?'A':'L')+'</span></div>'+
    '<div style="display:flex;align-items:center;gap:8px;'+(i===1?'flex-direction:row-reverse':'')+'"><span class="pts">'+S.scores[i]+'</span>'+
    '<span class="adj"><button data-act="adj" data-t="'+i+'" data-d="100" aria-label="Add 100 to '+esc(S.teams[i])+'">+100</button><button data-act="adj" data-t="'+i+'" data-d="-100" aria-label="Subtract 100 from '+esc(S.teams[i])+'">−100</button></span></div></div>';
}

function renderHost(){
  const p = S.phase;
  if(p==="lobby") return renderLobby();
  if(p==="end") return renderEnd();
  const q = cur();
  const lit = (p==="answer") ? S.buzzTeam : (p==="steal" ? S.stealTeam : null);
  let stage = "", status = "", buttons = "";
  if(p==="roundcard"){
    stage = '<div class="roundcard"><span class="eyebrow">Round '+(q.ri+1)+' of '+ROUNDS.length+'</span><h2>'+esc(q.round)+'</h2><p>'+esc(q.blurb)+'</p>'+
      (q.pts>100 ? '<span class="double">'+q.pts+' points per question</span>' : '<p class="muted">'+q.pts+' points per question</p>')+'</div>';
    status = '<div class="status"><span class="small muted">Buzz with your phone or your team key. Wrong answer? The other team gets one shot to steal.</span></div>';
    buttons = '<button class="btn primary" data-act="primary">Start round <kbd>Space</kbd></button>';
  } else {
    stage = (q.ml ? '<span class="mltag">ML bonus question</span>' : '')+'<p class="qtext">'+esc(q.text)+'</p><div class="opts">'+q.opts.map((o,i) => {
      let c = "";
      if(p==="reveal"){ c = i===q.correct ? " correct" : (S.wrong.includes(i) ? " wrong" : " dim"); }
      else if(S.wrong.includes(i)) c = " wrong";
      return '<button class="opt'+c+'" data-act="pick" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="tx">'+esc(o)+'</span></button>';
    }).join("")+'</div>';
    const tn = i => esc(S.teams[i]);
    if(p==="reading"){
      status = '<div class="status"><span class="big">Read the question…</span><div class="bar"><i></i></div><span class="small muted">Buzzers open in a moment</span></div>';
      buttons = '<button class="btn primary" data-act="primary">Open buzzers now <kbd>Space</kbd></button>';
    } else if(p==="open"){
      status = '<div class="status open"><span class="big">Buzzers are open!</span><span class="small">First team to buzz gets to answer</span></div>';
      buttons = '<button class="btn" data-act="primary">No one knows? Reveal <kbd>Space</kbd></button>';
    } else if(p==="answer"){
      const who = S.buzzName && S.buzzPeer ? ' · '+esc(S.buzzName)+' answers' : '';
      status = '<div class="status t'+(S.buzzTeam+1)+' buzzflash"><span class="big">'+tn(S.buzzTeam)+' buzzed first!'+who+'</span><span class="small">Pick an answer on the phone, or say it out loud · <span class="timer" id="tmr">10</span></span></div>';
      buttons = '<button class="btn" data-act="reopen">Re-open buzzers <kbd>R</kbd></button><button class="btn" data-act="wrong">Mark wrong <kbd>W</kbd></button>';
    } else if(p==="steal"){
      status = '<div class="status t'+(S.stealTeam+1)+'"><span class="big">Wrong! '+tn(S.stealTeam)+' can steal</span><span class="small">One shot at a different answer · <span class="timer" id="tmr">10</span></span></div>';
      buttons = '<button class="btn" data-act="primary">They missed. Reveal <kbd>Space</kbd></button>';
    } else if(p==="reveal"){
      const r = S.result; let big, cls = "status";
      if(r==="correct"){ big = tn(S.buzzTeam)+' got it! +'+q.pts; cls += " good"; }
      else if(r==="stolen"){ big = tn(S.stealTeam)+' stole it! +'+q.pts; cls += " good"; }
      else if(r==="missed"){ big = 'Nobody got it. The answer is '+esc(q.opts[q.correct]); }
      else { big = 'The answer is '+esc(q.opts[q.correct]); }
      status = '<div class="'+cls+'"><span class="big">'+big+'</span><span class="fact">'+esc(q.fact)+'</span></div>';
      const last = S.qi+1 >= S.order.length;
      buttons = '<button class="btn primary" data-act="primary">'+(last ? 'See the winner' : (S.order[S.qi+1].first ? 'Next round' : 'Next question'))+' <kbd>Space</kbd></button>';
    }
  }
  $app.innerHTML =
    '<div class="board">'+
      '<div class="scorebar">'+scoreBox(0, lit===0)+
        '<div class="center"><span class="rn">'+esc(q.round)+'</span><span class="qn">Question '+q.idxInRound+' of '+q.roundLen+' · '+(S.qi+1)+'/'+S.order.length+' overall</span></div>'+
        scoreBox(1, lit===1)+'</div>'+
      '<div class="stage">'+stage+'</div>'+
      status+
      '<div class="console"><span class="grow" id="buzzStrip"></span>'+buttons+'<button class="btn" data-act="fs" aria-label="Full screen">⛶</button><button class="btn" data-act="menu">Menu</button></div>'+
    '</div>';
  renderJoined();
  tick();
}

function renderLobby(){
  $app.innerHTML =
    '<div class="lobby">'+
      '<header class="brand">'+DIYAS+'<h1>Diwali Buzzer Trivia</h1><p class="sub">'+ROUNDS.reduce((n,r)=>n+r.qs.length,0)+' questions · 3 rounds · 2 teams · first to buzz answers</p></header>'+
      '<section class="teams">'+[0,1].map(i =>
        '<div class="team-card t'+(i+1)+'"><label for="team'+(i+1)+'">Team '+(i+1)+' name</label>'+
        '<input id="team'+(i+1)+'" data-team="'+i+'" maxlength="20" value="'+esc(S.teams[i])+'" autocomplete="off">'+
        '<div class="joined" id="joined'+i+'"></div>'+
        '<span class="keyline">Keyboard buzzer on this laptop: <kbd>'+(i===0?'A':'L')+'</kbd> or <kbd>'+(i===0?'Left':'Right')+' Shift</kbd></span></div>').join("")+
      '</section>'+
      '<section class="info">'+
        '<div class="box"><h3>Join on your phone</h3><div class="join"><div class="qr" id="qr" aria-label="QR code to join"></div>'+
          '<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="muted">Scan, or go to</span><span class="url">'+esc(joinUrlShort())+'</span><span class="muted">and enter room code</span><span class="code">'+hostCode+'</span></div></div>'+
          '<p class="muted" style="margin:12px 0 0">Names show up under each team once connected. No phone? The laptop keys always work.</p></div>'+
        '<div class="box"><h3>The rounds</h3><ul class="rounds">'+ROUNDS.map((r,i) => '<li><b>'+(i+1)+'. '+esc(r.name)+'</b><span>'+r.qs.length+' Qs · '+r.pts+' pts</span></li>').join("")+'</ul>'+
          '<p class="muted" style="margin:12px 0 0">Buzz first, pick the answer. Wrong answer gives the other team one shot to steal. Host keys: <kbd>Space</kbd> next · <kbd>1</kbd>–<kbd>4</kbd> pick · <kbd>W</kbd> wrong · <kbd>R</kbd> re-open buzzers</p></div>'+
      '</section>'+
      '<div class="console"><span class="grow" id="roomStatus"></span><button class="link" data-act="switch">This is a phone</button><button class="btn" data-act="fs">Full screen</button><button class="btn primary" data-act="primary">Start the game <kbd>Space</kbd></button></div>'+
    '</div>';
  renderRoomStatus();
  const qr = document.getElementById("qr");
  if(qr && typeof window.QRCode === "function"){
    try { new QRCode(qr, { text: joinUrl(), width: 150, height: 150, colorDark: "#160c24", colorLight: "#fbf0de", correctLevel: QRCode.CorrectLevel.M }); } catch(e){ qr.innerHTML = ""; }
  }
}

let fwStop = null;
function renderEnd(){
  const [a,b] = S.scores;
  const title = a===b ? "It’s a tie!" : esc(S.teams[a>b?0:1])+" wins!";
  $app.innerHTML = '<div class="end"><canvas id="fw" aria-hidden="true"></canvas>'+DIYAS+'<h1>Shubh Deepavali!</h1><h2>'+title+'</h2>'+
    '<div class="final">'+[0,1].map(i => '<div class="score t'+(i+1)+(((i===0&&a>b)||(i===1&&b>a))?' lit':'')+'"><span class="nm">'+esc(S.teams[i])+'</span><span class="pts">'+S.scores[i]+'</span></div>').join("")+'</div>'+
    '<div class="console" style="position:relative"><button class="btn primary" data-act="primary">Play again</button></div></div>';
  startFireworks();
}
function startFireworks(){
  if(fwStop) fwStop();
  const cv = document.getElementById("fw"); if(!cv) return;
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cx = cv.getContext("2d"); let W, H, parts = [], raf, last = 0, alive = true;
  const css = getComputedStyle(document.documentElement);
  const cols = ["--gold","--flame","--t1","--t2","--flame-core"].map(v => css.getPropertyValue(v).trim());
  const size = () => { W = cv.width = cv.offsetWidth * devicePixelRatio; H = cv.height = cv.offsetHeight * devicePixelRatio; };
  size(); addEventListener("resize", size);
  const burst = () => { const x = W*(.15+Math.random()*.7), y = H*(.12+Math.random()*.4), c = cols[Math.floor(Math.random()*cols.length)];
    for(let i=0;i<70;i++){ const ang = Math.random()*Math.PI*2, sp = (1+Math.random()*4)*devicePixelRatio; parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,c}); } };
  const step = t => { if(!alive) return; if(t-last>650){ burst(); last=t; }
    cx.clearRect(0,0,W,H);
    parts = parts.filter(p => p.life>0);
    for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05*devicePixelRatio; p.vx*=.985; p.life-=.012; cx.globalAlpha=Math.max(p.life,0); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,2.2*devicePixelRatio,0,Math.PI*2); cx.fill(); }
    raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  fwStop = () => { alive=false; cancelAnimationFrame(raf); removeEventListener("resize", size); fwStop=null; };
}

function tick(){
  const el = document.getElementById("tmr"); if(!el) return;
  const left = Math.max(0, 10 - Math.floor((Date.now()-S.phaseAt)/1000));
  el.textContent = left>0 ? left+"s" : "Time!";
}
setInterval(() => { if(mode==="host") tick(); }, 250);

/* ================= PHONE ================= */
let P = store.get("dbt-phone") || { team:null, nick:"", code:"" };
if(P.team!==0 && P.team!==1) P.team = null;
if(urlCode && urlCode!==P.code){ P.code = urlCode; P.team = null; }
if(!/^[A-Z]{4}$/.test(P.code||"")){ P.code = ""; P.team = null; }
let HOST = null, lastView = "", lastPhase = null, sent = {};

function pushPhonePresence(){
  if(!room || mode!=="buzzer") return;
  room.presence({ role:"buzzer", team:P.team, nick:clean(P.nick) || null }).catch(()=>{});
}
function phoneOnPeers(ch){
  let best = null;
  for(const p of ch.peers){ const pr = p.presence || {}; if(pr.role==="host" && (!best || (pr.since||0) > (best.since||0))) best = pr; }
  HOST = best;
  if(HOST && HOST.phase!==lastPhase){
    if(lastPhase && HOST.phase==="open") vibrate(40);
    if(HOST.phase==="reveal" && HOST.result && ["correct","stolen"].includes(HOST.result)){
      const winTeam = HOST.result==="correct" ? HOST.buzzTeam : HOST.stealTeam;
      if(winTeam===P.team) { sfx("right"); vibrate([60,60,60]); }
    }
    lastPhase = HOST.phase;
  }
  renderPhone();
}
function vibrate(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
let wake = null;
function keepAwake(){ try { if(navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(w => { wake=w; w.addEventListener("release", () => wake=null); }).catch(()=>{}); } catch(e){} }
document.addEventListener("visibilitychange", () => { if(mode==="buzzer" && document.visibilityState==="visible" && P.team!==null) keepAwake(); });

function hostKey(suffix){ return HOST ? HOST.epoch+":"+HOST.buzzId+(suffix||"") : null; }
function teamName(i){ return (HOST && Array.isArray(HOST.teams) && HOST.teams[i]) ? clean(HOST.teams[i]) : (i ? "Team Peacock" : "Team Saffron"); }

function phoneBuzz(){
  if(!room || !HOST || HOST.phase!=="open" || P.team===null) return;
  const k = hostKey(); if(sent.buzz===k) return;
  sent.buzz = k; sfx("buzz", P.team); vibrate(120);
  room.presence({ buzz:k }).catch(()=>{});
  renderPhone(true);
}
function phoneAnswer(i){
  if(!room || !HOST) return;
  const suffix = HOST.phase==="answer" ? "a" : (HOST.phase==="steal" ? "s" : null); if(!suffix) return;
  const k = hostKey(suffix);
  sent.ans = { k, c:i }; vibrate(30);
  room.presence({ ans:{ k, c:i } }).catch(()=>{});
  renderPhone(true);
}

function renderPhone(force){
  if(mode!=="buzzer") return;
  if(P.team===null){
    if(!document.getElementById("nick")) { renderPhoneSetup(); }
    else { [0,1].forEach(i => { const b = document.getElementById("pick"+i); if(b) b.textContent = teamName(i); }); }
    return;
  }
  const view = JSON.stringify([roomState, HOST, myPeer, P, sent]);
  if(!force && view===lastView) return;
  lastView = view;

  const T = P.team, other = 1-T;
  const scores = HOST && Array.isArray(HOST.scores) ? HOST.scores : [0,0];
  let main = "";
  const optsHtml = (exclude) => '<div class="ph-opts">'+(HOST.opts||[]).map((o,i) =>
    '<button class="opt'+(exclude.includes(i)?' wrong':'')+'" data-act="ans" data-i="'+i+'"'+(exclude.includes(i)?' disabled':'')+'><span class="n">'+(i+1)+'</span><span class="tx">'+esc(o)+'</span></button>').join("")+'</div>';
  const lockedIn = suffix => sent.ans && sent.ans.k===hostKey(suffix) && HOST.opts ? '<p class="ph-msg">Locked in: '+esc(HOST.opts[sent.ans.c])+'</p><p class="ph-sub">Watch the big screen!</p>' : null;

  if(roomState==="off"){
    main = '<div class="notice"><p class="ph-msg" style="font-size:22px">The buzzer couldn’t load.</p><p class="ph-sub" style="max-width:none">Check your internet connection and reload this page. Meanwhile, your team can buzz on the laptop with <kbd>'+(T===0?'A':'L')+'</kbd>.</p></div>';
  } else if(roomState==="nohost" && !HOST){
    main = '<p class="ph-msg">No game found for room '+esc(P.code)+'</p><p class="ph-sub">Check the code on the big screen. I’ll keep trying.</p><button class="btn" data-act="ph-change">Change room code</button>';
  } else if(!HOST){
    main = '<p class="ph-msg">Connecting to room '+esc(P.code)+'…</p><p class="ph-sub">Make sure you have internet.</p>';
  } else {
    const ph = HOST.phase;
    if(ph==="lobby"){
      main = '<p class="ph-msg">You’re on '+esc(teamName(T))+'!</p><p class="ph-sub">Keep this screen open. Your buzzer lights up when the game starts.</p><button class="buzzer t'+(T+1)+'" disabled>BUZZ</button>';
    } else if(ph==="roundcard"){
      main = '<p class="ph-sub">Up next</p><p class="ph-msg">'+esc(HOST.round||"")+'</p><p class="ph-sub">'+(HOST.pts||100)+' points per question</p><button class="buzzer t'+(T+1)+'" disabled>BUZZ</button>';
    } else if(ph==="reading"){
      main = '<p class="ph-q">'+esc(HOST.q||"")+'</p><p class="ph-msg">Get ready…</p><button class="buzzer t'+(T+1)+'" disabled>WAIT</button>';
    } else if(ph==="open"){
      const done = sent.buzz===hostKey();
      main = '<p class="ph-q">'+esc(HOST.q||"")+'</p>'+(done ? '<p class="ph-msg">Buzzed! Hold on…</p><button class="buzzer t'+(T+1)+'" disabled>BUZZED</button>'
                       : '<button class="buzzer t'+(T+1)+'" data-act="buzz">BUZZ!</button>');
    } else if(ph==="answer"){
      if(HOST.buzzPeer && HOST.buzzPeer===myPeer){
        main = lockedIn("a") || ('<p class="ph-msg">You buzzed first! Pick your answer</p><p class="ph-q">'+esc(HOST.q||"")+'</p>'+optsHtml(HOST.wrong||[]));
      } else if(HOST.buzzTeam===T){
        main = '<p class="ph-msg">'+esc(teamName(T))+' buzzed first!</p><p class="ph-sub">'+(HOST.buzzName && HOST.buzzPeer ? esc(clean(HOST.buzzName))+' is answering.' : 'Say your answer out loud!')+'</p>';
      } else {
        main = '<p class="ph-msg">'+esc(teamName(other))+' buzzed first</p><p class="ph-sub">If they get it wrong, your team can steal. Stay ready!</p>';
      }
    } else if(ph==="steal"){
      if(HOST.stealTeam===T){
        main = lockedIn("s") || ('<p class="ph-msg">Steal! Pick a different answer</p><p class="ph-sub">First tap from your team counts.</p>'+optsHtml(HOST.wrong||[]));
      } else {
        main = '<p class="ph-msg">'+esc(teamName(other))+' is trying to steal…</p>';
      }
    } else if(ph==="reveal"){
      const r = HOST.result, ans = HOST.opts && typeof HOST.correct==="number" ? HOST.opts[HOST.correct] : "";
      const winTeam = r==="correct" ? HOST.buzzTeam : (r==="stolen" ? HOST.stealTeam : null);
      main = (winTeam===null ? '<p class="ph-msg">No points this time</p>' :
              '<p class="ph-msg">'+(winTeam===T ? 'Nice! ' : '')+esc(teamName(winTeam))+' +'+(HOST.pts||100)+'</p>')+
             '<p class="ph-sub">Answer: <b>'+esc(ans)+'</b></p>';
    } else if(ph==="end"){
      const w = HOST.winner;
      main = '<p class="ph-msg">Shubh Deepavali!</p><p class="ph-msg">'+(w===-1 ? "It’s a tie!" : esc(teamName(w))+' wins!')+'</p>'+(w===T ? '<p class="ph-sub">Your team won. Go claim the mithai.</p>' : '');
    }
  }
  $app.innerHTML =
    '<div class="phone">'+
      '<div class="ph-top"><span class="pill t'+(T+1)+'">'+esc(teamName(T))+'</span><span class="who">'+esc(clean(P.nick)||"Player")+'</span><button class="link" data-act="ph-change">Change</button></div>'+
      (HOST && HOST.phase!=="lobby" ? '<div class="ph-score"><span class="s1">'+esc(teamName(0))+' '+scores[0]+'</span><span class="muted">Q '+(HOST.qn||"")+'/'+(HOST.total||30)+'</span><span class="s2">'+scores[1]+' '+esc(teamName(1))+'</span></div>' : '')+
      '<div class="ph-main">'+main+'</div>'+
    '</div>';
}
function renderPhoneSetup(){
  $app.innerHTML =
    '<div class="phone"><div class="ph-main"><div class="setup">'+DIYAS+
      '<h1 style="font-size:34px;color:var(--gold);text-align:center">Diwali Buzzer</h1>'+
      '<label for="roomcode">Room code (on the big screen)</label><input id="roomcode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" value="'+esc(P.code)+'" style="font-family:var(--display);font-size:28px;letter-spacing:.2em;text-transform:uppercase">'+
      '<label for="nick">Your name</label><input id="nick" maxlength="20" autocomplete="off" placeholder="e.g. Priya" value="'+esc(P.nick)+'">'+
      '<p class="err" id="setupErr" role="alert"></p>'+
      '<label>Pick your team</label><div class="teampick"><button class="t1" id="pick0" data-act="team" data-t="0">'+esc(teamName(0))+'</button><button class="t2" id="pick1" data-act="team" data-t="1">'+esc(teamName(1))+'</button></div>'+
      '<button class="link" data-act="switch" style="align-self:center">This is the projector screen</button>'+
    '</div></div></div>';
}

/* ================= Mode picker & wiring ================= */
function renderPicker(){
  $app.innerHTML = '<div class="picker">'+DIYAS+'<h1>Diwali Buzzer Trivia</h1><p class="muted">How is this screen being used?</p>'+
    '<div class="pick-grid"><button class="pick" data-act="mode" data-m="host"><strong>Projector / host screen</strong><span>Shows the questions and scores. One per party.</span></button>'+
    '<button class="pick" data-act="mode" data-m="buzzer"><strong>My phone is a buzzer</strong><span>Pick a team and slam the button.</span></button></div></div>';
}
function setMode(m){
  mode = m; store.set("dbt-mode", m); lastView = "";
  if(fwStop) fwStop();
  if(m==="host"){
    hostSince = Date.now();
    startRoom(hostCode);
    if(["reading","open"].includes(S.phase) && cur()) beginReading(); else { pushPresence(); renderHost(); }
  } else {
    startRoom(P.team!==null ? P.code : null);
    pushPhonePresence(); renderPhone(true);
  }
}
function boot(){
  if(mode==="host"||mode==="buzzer") setMode(mode); else renderPicker();
}

$app.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset && t.dataset.team!==undefined){ S.teams[+t.dataset.team] = t.value.slice(0,20); store.set("dbt-host", S); pushPresence(); }
  if(t.id==="nick"){ P.nick = t.value.slice(0,20); store.set("dbt-phone", P); }
  if(t.id==="roomcode"){ const v = t.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4); if(v!==t.value) t.value = v; }
});
$app.addEventListener("pointerdown", e => {
  const b = e.target.closest('[data-act="buzz"]');
  if(b){ e.preventDefault(); ac(); phoneBuzz(); }
});
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  ac();
  if(act==="mode") setMode(b.dataset.m);
  else if(act==="switch"){ setMode(mode==="host" ? "buzzer" : "host"); }
  else if(act==="primary") primary();
  else if(act==="pick") choose(+b.dataset.i);
  else if(act==="reopen") reopen();
  else if(act==="wrong") markWrong();
  else if(act==="adj"){ const t=+b.dataset.t; S.scores[t]+= +b.dataset.d; store.set("dbt-host", S); pushPresence(); renderHost(); }
  else if(act==="fs"){ try { const r = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if(r && r.catch) r.catch(()=>{}); } catch(err){} }
  else if(act==="menu"){ newGameMenu(); }
  else if(act==="team"){
    const n = document.getElementById("nick"), rc = document.getElementById("roomcode"), er = document.getElementById("setupErr");
    const code = (rc ? rc.value : P.code).toUpperCase().replace(/[^A-Z]/g,"");
    if(code.length!==4){ if(er) er.textContent = "Enter the 4-letter room code from the big screen."; if(rc) rc.focus(); return; }
    if(n) P.nick = n.value.slice(0,20);
    P.code = code; P.team = +b.dataset.t; store.set("dbt-phone", P); keepAwake();
    if(!room || roomCode!==code) startRoom(code);
    pushPhonePresence(); renderPhone(true);
  }
  else if(act==="ph-change"){ P.team = null; store.set("dbt-phone", P); pushPhonePresence(); renderPhoneSetup(); }
  else if(act==="ans") phoneAnswer(+b.dataset.i);
  else if(act==="confirm-new") newGame();
  else if(act==="confirm-phone") setMode("buzzer");
  else if(act==="close-menu") renderHost();
  if(b.blur) b.blur();
});
function newGameMenu(){
  const c = document.querySelector(".console"); if(!c) return;
  c.innerHTML = '<span class="grow">Leave the game?</span><button class="btn" data-act="close-menu">Keep playing</button><button class="btn" data-act="confirm-phone">Use as phone buzzer</button><button class="btn" data-act="confirm-new">End game &amp; back to setup</button>';
}

document.addEventListener("keydown", e => {
  if(mode!=="host" || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.target && e.target.matches && e.target.matches("input,textarea")) return;
  const k = (e.key||"").toLowerCase();
  if(e.code==="ShiftLeft" || k==="a"){ acceptBuzz(0, null, ""); }
  else if(e.code==="ShiftRight" || k==="l"){ acceptBuzz(1, null, ""); }
  else if(["1","2","3","4"].includes(e.key)){ choose(+e.key-1); }
  else if(k===" " || k==="enter"){ e.preventDefault(); ac(); primary(); }
  else if(k==="r"){ if(["answer","steal"].includes(S.phase)) reopen(); }
  else if(k==="w"){ markWrong(); }
});

boot();
})();
</script>
